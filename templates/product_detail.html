<!DOCTYPE html>
<html>
<head>
    <title>{{ product['name'] }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <h2>{{ product['name'] }}</h2>

    <img src="{{ url_for('static', filename='images/products/' + product['image']) }}"
         width="300">

    <h4 class="mt-3">
        Price: ${{ product['price'] }}
    </h4>

    <p>
        {{ product['description'] }}
    </p>

    <p>
        Category: {{ product['category'] }}
    </p>
<td>

    <a href="/product/{{ product['id'] }}" class="btn btn-info btn-sm">
        Details
    </a>

    <a href="/edit_product/{{ product['id'] }}" class="btn btn-warning btn-sm">
        Edit
    </a>

    <a href="/delete_product/{{ product['id'] }}" class="btn btn-danger btn-sm">
        Delete
    </a>
<a href="/add_to_cart/{{ product['id'] }}" class="btn btn-success">
    Add to Cart 🛒
</a>

<a href="/products" class="btn btn-secondary">
    Back to Products
</a>

</td>

</div>

</body>
</html>
