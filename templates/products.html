<!DOCTYPE html>
<html>
<head>
    <title>Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

<h2>Product List</h2>

<form method="GET" action="/products" class="mb-4">

    <div class="input-group">

        <input
            type="text"
            name="search"
            class="form-control"
            placeholder="Search products..."
            value="{{ search }}"
        >

        <button class="btn btn-primary" type="submit">
            Search
        </button>

    </div>

    <select name="category" class="form-select mt-2">
        <option value="">All Categories</option>

        {% for cat in categories %}
        <option value="{{ cat['category'] }}">
            {{ cat['category'] }}
        </option>
        {% endfor %}

    </select>

</form>

<a href="/add_product" class="btn btn-success mb-3">
Add Product
</a>

<table class="table table-bordered">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Price</th>
    <th>Description</th>
    <th>Category</th>
    <th>Image</th>
    <th>Action</th>
</tr>

{% for product in products %}

<tr>

<td>{{ product['id'] }}</td>

<td>{{ product['name'] }}</td>

<td>${{ product['price'] }}</td>

<td>{{ product['description'] }}</td>

<td>{{ product['category'] }}</td>

<td>{{ product['image'] }}</td>
<td>

    <a href="/product/{{ product['id'] }}" class="btn btn-info btn-sm">
        Details
    </a>

    <a href="/edit_product/{{ product['id'] }}" class="btn btn-warning btn-sm">
        Edit
    </a>

    <a href="/delete_product/{{ product['id'] }}"
   class="btn btn-danger btn-sm"
   onclick="return confirm('Are you sure you want to delete this product?');">
    Delete
</a>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
